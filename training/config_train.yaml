# Training config for wav2vec2 -> AASIST spoof detector.
seed: 42
device: auto              # auto | cpu | cuda   (cuda/auto+gpu -> e2e mode; else frozen)

manifests:
  train: data/manifests/train.tsv
  dev: data/manifests/dev.tsv
  eval: data/manifests/eval.tsv

cache_dir: data/processed/feat_cache   # frozen-mode per-utt SSL features

frontend:
  # keep model_id in sync with config/config.yaml for serving parity, UNLESS fine-tuned
  # (then the tuned weights ride in the checkpoint and the pipeline picks them up).
  model_id: facebook/wav2vec2-xls-r-300m
  layer: -1
  stage2_unfreeze_epoch: 6   # e2e: frontend frozen for N epochs, then unfrozen at lr*mult

classifier:
  embed_dim: 256
  num_classes: 2

batch_size: 8            # e2e (waveform+frontend); frozen mode can go much higher
grad_accum: 4            # effective batch = batch_size * grad_accum
num_workers: 0           # 0 = load in the main process; >0 can deadlock with the parquet-backed dataset
epochs: 20
crop_seconds: 4.0
max_frames: 400          # frozen mode: cap on cached feature frames per clip
frozen_max_per_class: 8000   # frozen mode only: cap ASVspoof train per class (cache size)
dev_subsample: 3000      # per-epoch dev EER on a balanced 3k subset (final eval uses all)

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  frontend_lr_mult: 0.1   # frontend LR after unfreeze

loss:
  name: oc_softmax        # weighted_ce | oc_softmax  (OC-Softmax generalises better)
  bonafide_weight: 1.0
  spoof_weight: 1.0

augment:
  rawboost: true          # e2e only (waveform-level)
  rawboost_mode: 5        # 1 conv · 2 impulsive · 3 stationary · 4 (1->2) · 5 (1->2 +3) · 6 (1+2)
  rawboost_p: 0.5
  environmental: true          # e2e only. MUSAN noise + RIR reverb — complements rawboost,
                                # which has no real-world ambient noise / room reverb model.
  environmental_mode: both     # noise | reverb | both
  environmental_p: 0.5
  # Real-world eval showed the model shortcuts on "genuine room/line noise -> bonafide": the
  # merged real-world bonafide data is *always* authentically channel-degraded, while spoof
  # only draws this augmentation at the base rate below, so channel character alone became a
  # usable (wrong) cue. p_spoof pushes spoof's draw rate above bonafide's to break that
  # correlation; leave unset (None) to fall back to environmental_p for every label.
  environmental_p_spoof: 0.75
  environmental_snr_min_db: 0
  environmental_snr_max_db: 20
  # Kaggle-input paths (this notebook's attached Datasets) — switch back to the
  # local data/raw/ paths below if running outside this Kaggle notebook.
  musan_dir: /kaggle/input/datasets/nhattruongdev/musan-noise/musan/noise
  rir_dir: /kaggle/input/datasets/tuannguyenvananh/room-impulse-response-and-noise-database/RIRS_NOISES/simulated_rirs
  # musan_dir: data/raw/musan/musan/noise
  # rir_dir: data/raw/rir_noises/RIRS_NOISES/simulated_rirs
  telephone: true              # e2e only. Bandlimit (~300-3400Hz) + G.711 A-law codec
                                # round-trip + light line noise — simulates a real phone-call
                                # channel. Applied to BOTH bonafide and spoof (like rawboost/
                                # environmental) so the model can't shortcut on "degraded
                                # audio = fake" — see training/augment_telephone.py.
  telephone_p: 0.45
  # Same rationale as environmental_p_spoof above: ep5/ep6 real-world eval showed the model
  # learned "sounds like a real phone channel -> bonafide" (ai_replayed, the most authentically
  # phone-channel spoof domain, had the WORST accuracy of all four domains: 0%). All merged
  # real-world bonafide rows are genuine call recordings; spoof only gets this augmentation at
  # the base rate. Starting moderate (not 1.0) per the plan to raise it further if this helps
  # without hurting bonafide accuracy — check eval's real_phone/real_laptop rows each epoch.
  telephone_p_spoof: 0.75
  telephone_low_hz: 300
  telephone_high_hz: 3400
  telephone_snr_min_db: 15
  telephone_snr_max_db: 35

checkpoint:
  out: backend/models/aasist_indicw2v.pt
  select_metric: dev_eer
